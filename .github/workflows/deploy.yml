name: Deploy to GitHub Pages

on:
  # Se ejecuta en cada push a la rama principal
  push:
    branches: [ main ]
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos necesarios para que el job pueda clonar el repo y publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # with:
          # path: . # La raíz de tu proyecto Astro (opcional)
          # node-version: 20 # Versión de Node (opcional, por defecto 20)
          # package-manager: pnpm@latest # Gestor de paquetes (opcional, se detecta automáticamente)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4